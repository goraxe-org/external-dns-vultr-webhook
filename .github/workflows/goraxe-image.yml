# goraxe-org fork only: build and push the webhook image to GHCR.
# Uses only actions/* and docker/* actions.
name: goraxe image

on:
  push:
    tags: ["v*-goraxe.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/goraxe-org/external-dns-vultr-webhook

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -o "linux/${arch}/external-dns-vultr-webhook" ./cmd/webhook
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/goraxe-org/external-dns-vultr-webhook
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Digest
        run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" | tee -a "${GITHUB_STEP_SUMMARY}"
